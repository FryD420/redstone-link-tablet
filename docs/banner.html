function box(parent,l,t,w,h,c,glow){

  d.style.cssText='position:absolute;left:'+l+'%;top:'+t+'%;width:'+w+'%;height:'+h+'%;background:'+c+';border-radius:2px;'+(glow?'box-shadow:0 0 8px 2px '+c+';':'');
  parent.appendChild(d);
}
function gameScreen(s,kind){
  s.style.display='block';
  if(kind==='snake'){
    s.style.background='#16321a';
    box(s,10,55,13,20,'#8fe08f',1); box(s,23,55,13,20,'#8fe08f'); box(s,36,55,13,20,'#8fe08f');
    box(s,36,32,13,20,'#8fe08f'); box(s,49,32,13,20,'#6cc86c');
    box(s,74,20,12,18,'#ff5c5c',1);

    box(s,40,8,20,22,'#f9801d',1); box(s,60,8,20,22,'#f9801d'); box(s,40,30,20,22,'#f9801d');
  } else if(kind==='breakout'){
    s.style.background='#141428';
    for(let b=0;b<5;b++){ box(s,4+b*19,8,17,16,['#e06666','#f9801d','#f2c94c','#7fd17f','#6fa8dc'][b]); }

  }

const KINDS=Array(24).fill('pips');
const CYCLE=['snake','tetris','breakout','g2048'];
for(let i=0;i<=6;i++) KINDS[i]=CYCLE[i%4];       // top visible strip
for(let i=14;i<24;i++) KINDS[i]=CYCLE[(i+2)%4];  // bottom visible strip
for(let i=0;i<24;i++){
  const t=document.createElement('div'); t.className='tab';
  const w=150+Math.floor(wrnd()*40), h=118+Math.floor(wrnd()*26);
  t.style.width=w+'px'; t.style.height=h+'px';
  t.style.background=DYES[Math.floor(wrnd()*DYES.length)];
  const s=document.createElement('div'); s.className='scr';
  const kind=KINDS[i];
  if(kind==='pips'){
    for(let p=0;p<6;p++){
      const d=document.createElement('div'); d.className='pip';
      if(wrnd()<0.45){ const c=ACCENT[Math.floor(wrnd()*ACCENT.length)]; d.style.background=c; d.style.boxShadow='0 0 10px 2px '+c; }
      else d.style.background='#262a33';
      s.appendChild(d);
    }
  } else gameScreen(s,kind);
  t.appendChild(s); wall.appendChild(t);
}

function rowGridBig(word){ // native-res font, thin 1-col gaps, values 0/1/2
  let cols=0; const glyphs=[];
  for(const ch of word){ const g=FBIG[ch]; glyphs.push(g); cols+=g[0].length+1; }
  cols-=1;
  const grid=Array.from({length:18},()=>new Array(cols).fill(0));
  let x=0;
  for(const g of glyphs){
    for(let r=0;r<18;r++) for(let c=0;c<g[0].length;c++){
      if(g[r][c]==='#') grid[r][x+c]=1;
      else if(g[r][c]==='2') grid[r][x+c]=2;
    }
    x+=g[0].length+1;
  }

function rowGrid(word){ // doubled resolution: smooth faces, thin 1-subcol gaps
  let cols=0; const glyphs=[];
  for(const ch of word){ if(ch===' '){glyphs.push(null); cols+=4; continue;} const g=F[ch]; glyphs.push(g); cols+=g[0].length*2+1; }
  cols-=1;
  const grid=Array.from({length:H*2},()=>new Array(cols).fill(false));
  let x=0;
  for(const g of glyphs){
    if(!g){x+=4;continue;}
    for(let r=0;r<H;r++) for(let c=0;c<g[0].length;c++) if(g[r][c]==='#')
      for(let rr=0;rr<2;rr++) for(let cc=0;cc<2;cc++) grid[2*r+rr][x+2*c+cc]=true;
    x+=g[0].length*2+1;

function cogGrid(n){ // n x n pixel cog: ring + 8 teeth + hub hole
  const g=Array.from({length:n},()=>new Array(n).fill(false));
  const cx=(n-1)/2, cy=(n-1)/2;
  const R2=n*0.335, R1=n*0.21, R0=n*0.10, RT=n*0.5;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const dx=c-cx, dy=r-cy, d=Math.hypot(dx,dy);
    let a=Math.atan2(dy,dx); if(a<0)a+=Math.PI*2;
    const sector=(a+Math.PI/8)%(Math.PI/4) < Math.PI/5.6; // 8 fat teeth
    if(d<=R0) continue;               // hub hole
    if(d<=R2 && d>=R1){g[r][c]=true; continue;}   // ring
    if(d<R1){g[r][c]=true; continue;} // solid inner (minus hub)
    if(d<=RT && sector){g[r][c]=true;}            // teeth

}

function makeSil(grid,sx,sy){
  const oc=document.createElement('canvas');
  oc.width=grid[0].length*sx; oc.height=grid.length*sy;
  const g=oc.getContext('2d'); g.fillStyle='#000';
  for(let r=0;r<grid.length;r++) for(let c=0;c<grid[0].length;c++)
    if(grid[r][c]) g.fillRect(c*sx,r*sy,sx,sy);

function expand(oc,rad){
  const oc2=document.createElement('canvas');
  oc2.width=oc.width+2*rad; oc2.height=oc.height+2*rad;
  const g=oc2.getContext('2d');
  for(let i=-rad;i<=rad;i++) for(let j=-rad;j<=rad;j++) g.drawImage(oc,rad+i,rad+j);
  return oc2;
}

function smoothCogSil(D){ // Create-style cog: 8 teeth, square axle hole, 4 spoke holes
  const Rt=D/2, Rb=Rt*0.78, tw=Rt*0.36, Rh=Rt*0.20, pad=3, N=Math.ceil(D)+2*pad;

  for(let i=0;i<4;i++){ g.save(); g.rotate(i*Math.PI/4); g.fillRect(-tw/2,-Rt,tw,2*Rt); g.restore(); }

function metrics(ch){
  const code=ch.charCodeAt(0), cx=8*(code%16), cy=8*Math.floor(code/16);

  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  for(let d=0;d<=ex;d++) ctx.drawImage(whi,-whi.width/2+px(d),-whi.height/2+d);
  for(let d=0;d<=ex;d++) ctx.drawImage(mar,-mar.width/2+px(d),-mar.height/2+d);
  for(let d=ex;d>=1;d--) ctx.drawImage(dark,-spr.width/2+px(d),-spr.height/2+d);
  ctx.drawImage(spr,-spr.width/2,-spr.height/2);
  ctx.restore();
}
Promise.all([loadImg(SHEET),loadImg(TABF),loadImg(TABB),loadImg(TABD)]).then(([sh,tabF,tabBase,tabDet])=>{
  sheet=sh;
  const tabB=document.createElement('canvas'); tabB.width=16; tabB.height=16;
  const tbg=tabB.getContext('2d'); tbg.drawImage(tabBase,0,0); tbg.drawImage(tabDet,0,0);
  const mc=document.createElement('canvas'); mc.width=128; mc.height=128;
  const mg=mc.getContext('2d'); mg.drawImage(sheet,0,0);
  const data=mg.getImageData(0,0,128,128).data;
  sheetAlpha=(x,y)=>data[(y*128+x)*4+3];
  // CREATE in the signature typeface — BOLD
  const sw1=srcWidth('CREATE',1);
  const S1=Math.floor(860/sw1), Sy1=Math.round(S1*1.15);
  const sil1=bitmapSil('CREATE',S1,Sy1,1);
  const h1=sil1.height, w1=sil1.width;
  const cx0=(1200-w1)/2, cy0=48;
  const ex1=Math.round(h1*0.19), ol1=Math.max(5,Math.round(h1*0.040)), wl1=ol1+4;
  // flanking art: GUI screenshot left, detailed tablet back right, drawn first so CREATE overlaps
  const cyC=cy0+h1/2;
  const olT=Math.max(4,Math.round(h1*0.03)), wlT=olT+3;
  const GH=h1*0.92, GW=GH*424/364;
  drawArt(tabF,748,358,424,364, cx0-0.24*GW,cyC,GH,-0.14,olT,wlT,false);
  const TH=h1*1.0, TW=TH*12/14;
  drawArt(tabB,2,1,12,14, cx0+w1+0.30*TW,cyC,TH,0.16,olT,wlT,true);
  drawStyled(ctx,sil1,cx0,cy0,GOLD,ex1,ol1,wl1,Math.round(S1*0.38));
  // subtitle in the same typeface, three materials — BOLD, angled down
  const words=[['REDSTONE',REDSTONE],['LINK',IRON],['TABLET',BRASS]];
  const gapPx=26;
  const sumSrc=words.reduce((a,w)=>a+srcWidth(w[0],1),0);
  const S2=Math.max(2,Math.floor((980-2*gapPx)/sumSrc)), Sy2=Math.round(S2*1.15);
  const sils=words.map(w=>bitmapSil(w[0],S2,Sy2,1));
  const w2=sils.reduce((a,s)=>a+s.width,0)+2*gapPx;
  const h2=Math.max(...sils.map(s=>s.height));
  const ex2=Math.round(h2*0.19), ol2=Math.max(4,Math.round(h2*0.05)), wl2=ol2+3;
  const y2=cy0+h1+ex1+16;
  const cv2=document.getElementById('c2'), g2=cv2.getContext('2d');
  let x=(1200-w2)/2;
  sils.forEach((s,i)=>{ drawStyled(g2,s,x,16+(h2-s.height),words[i][1],ex2,ol2,wl2,Math.round(S2*0.42)); x+=s.width+gapPx; });
  cv2.style.top=y2+'px';
  cv2.style.transform='perspective(800px) rotateX(-10deg)'; // faces tilt to look downward, subtle
});
